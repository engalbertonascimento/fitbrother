<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Treino do Dia</title>
<style>
/* reutiliza a mesma paleta visual da home */
:root{
  --primary:#ffce45; --primary-600:#e0b000;
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#6b7280; --success:#34d399;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter, system-ui, Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.header{background:var(--primary);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.back{font-size:20px;cursor:pointer;border:none;background:transparent}
.title{font-weight:800;font-size:16px}
.container{padding:16px;padding-bottom:120px}
.box{background:var(--card);padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.small{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px}
.done-btn{background:var(--primary);border:none;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}
.done-btn.done{background:var(--success)}
.progress-bar{height:10px;background:#eee;border-radius:10px;overflow:hidden;width:140px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-600));width:0%;transition:width .3s}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-around;padding:8px 20px;box-shadow:0 -6px 20px rgba(0,0,0,0.06)}
.nav-button{display:flex;flex-direction:column;align-items:center;border:none;background:transparent;cursor:pointer;gap:6px}
.nav-button span{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:1400;box-shadow:0 6px 20px rgba(0,0,0,0.4)}
</style>
</head>
<body>
  <div class="header">
    <button class="back" id="backBtn">←</button>
    <div class="title" id="headerTitle">Treino</div>
    <div style="margin-left:auto" class="small" id="dayLabel"></div>
  </div>

  <main class="container">
    <div class="box" id="bikeBox">
      <div style="display:flex;gap:12px;align-items:center">
        <div style="font-size:22px">🚴</div>
        <div>
          <div style="font-weight:700">30 minutos de Bicicleta (jejum)</div>
          <div class="small">Aquecimento aeróbico leve — hidratação e postura</div>
        </div>
        <div style="margin-left:auto"><label class="small"><input type="checkbox" id="bikeDone"> Concluído</label></div>
      </div>
      <div style="margin-top:10px" class="small">Sugestão: iniciar cronômetro 30 min — botão abaixo.</div>
      <div class="controls" style="margin-top:8px">
        <button id="startBike" class="done-btn">Iniciar 30m</button>
        <div id="bikeTimer" class="small"></div>
      </div>
    </div>

    <div id="exerciseList"></div>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:10px;">
      <button id="finishAll" class="done-btn">Concluir Treino</button>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Navegação inferior">
    <button class="nav-button" onclick="location.href='index.html'">🏠<span>Home</span></button>
    <button class="nav-button" onclick="location.href='index.html'">🏋️<span>Treinos</span></button>
    <button class="nav-button" onclick="location.href='progresso.html'">📈<span>Progresso</span></button>
  </nav>

  <div id="toast"></div>

<script>
/* small util */
function $(s){return document.querySelector(s)}
function nowYMD(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

/* data */
const mapDayToTreino = {segunda:'A',terca:'B',quarta:'C',quinta:'A',sexta:'B'};
const treinos = {
  A:['Flexão de parede','Elevação de ombros com halteres','Extensão de tríceps acima da cabeça com um halter','Desenvolvimento com halteres','Supino com halteres'],
  B:['Agachamento sem peso','Afundo','Troca elevação','Panturrilha em pé','Prancha'],
  C:['Remada inclinada com halteres - troca','Remada unilateral (apoio sofá)','Rosca bíceps com halteres','Elevação lateral com halteres','Prancha lateral']
};

/* parse day */
const p = new URLSearchParams(location.search);
let day = p.get('day') || 'segunda';
if(day==='hoje'){ const w = new Date().getDay(); const mapIdx = {1:'segunda',2:'terca',3:'quarta',4:'quinta',5:'sexta'}; day = mapIdx[w] || 'segunda'; }
const treino = mapDayToTreino[day] || 'A';
$('#headerTitle').innerText = `Treino ${treino}`; $('#dayLabel').innerText = day.charAt(0).toUpperCase()+day.slice(1);

/* render exercises */
const elList = $('#exerciseList');
const storageKey = 'exercise_done_v3';
let state = JSON.parse(localStorage.getItem(storageKey) || '{}');

function render(){
  elList.innerHTML='';
  treinos[treino].forEach((name,i)=>{
    const key = `${day}_${i}`;
    const done = !!state[key];
    const div = document.createElement('div'); div.className='box';
    div.innerHTML = `
      <div style="display:flex;gap:12px">
        <div style="flex:1">
          <div style="font-weight:700">${i+1}. ${name}</div>
          <div class="small" style="margin-top:6px">Descrição rápida do exercício.</div>
          <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
            <div class="progress-bar"><div class="progress-fill" id="fill-${i}" style="width:${done?100:0}%"></div></div>
            <select id="sel-${i}" style="padding:6px;border-radius:8px">
              <option value="30">30s</option><option value="45">45s</option><option value="60">60s</option>
            </select>
            <button class="done-btn" id="btn-${i}" style="margin-left:auto">${done?'✔ Feito':'Marcar como feito'}</button>
          </div>
        </div>
      </div>
    `;
    elList.appendChild(div);
    // handlers
    div.querySelector('#btn-'+i).addEventListener('click', ()=> toggleDone(i));
    div.querySelector('#sel-'+i).addEventListener('change', ()=> {/* noop for now */});
  });
}
render();

function toggleDone(i){
  const key = `${day}_${i}`;
  state[key] = !state[key];
  if(!state[key]) delete state[key];
  localStorage.setItem(storageKey, JSON.stringify(state));
  const btn = $('#btn-'+i), fill = $('#fill-'+i);
  if(state[key]){ btn.classList.add('done'); btn.innerText='✔ Feito'; fill.style.width='100%'; playSuccess(); } else { btn.classList.remove('done'); btn.innerText='Marcar como feito'; fill.style.width='0%'; }
}

/* finish all */
$('#finishAll').addEventListener('click', ()=>{
  // mark day done
  const doneKey = 'treinosConcluidos_v2';
  const doneObj = JSON.parse(localStorage.getItem(doneKey)||'{}');
  doneObj[day]=true;
  localStorage.setItem(doneKey, JSON.stringify(doneObj));
  // history
  const h = JSON.parse(localStorage.getItem('history_v2')||'[]');
  h.unshift({day:day,date:nowYMD()});
  localStorage.setItem('history_v2', JSON.stringify(h.slice(0,200)));
  // points
  const pts = Number(localStorage.getItem('points_v2')||0) + 15;
  localStorage.setItem('points_v2', String(pts));
  // notify parent (home)
  try{ window.opener && window.opener.postMessage({type:'treinoConcluido',day},'*'); }catch(e){}
  try{ window.parent && window.parent.postMessage({type:'treinoConcluido',day},'*'); }catch(e){}
  showToast('Treino concluído! Bom trabalho!');
  setTimeout(()=> location.href='index.html',900);
});

/* bike timer */
let bikeIv=null;
$('#startBike').addEventListener('click', ()=>{
  startCountdown(30*60, '#bikeTimer', ()=>{ $('#bikeDone').checked=true; localStorage.setItem('bike_v2', nowYMD()); });
});
function startCountdown(sec, sel, cb){
  clearInterval(bikeIv);
  let s=sec; const el = document.querySelector(sel);
  el.innerText = formatTime(s);
  bikeIv = setInterval(()=>{ s--; if(s<0){ clearInterval(bikeIv); el.innerText='✔ Pronto'; cb && cb(); return; } el.innerText = formatTime(s); },1000);
}
function formatTime(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

/* toast & sound */
function showToast(msg,t=1400){ const tbox = $('#toast'); tbox.innerText = msg; tbox.style.display='block'; setTimeout(()=>{ tbox.style.display='none' }, t); }
function playSuccess(){ try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type='sine'; o.frequency.value=880; g.gain.value=0.0001; o.connect(g); g.connect(ctx.destination); o.start(0); g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16); setTimeout(()=>{ o.stop(); ctx.close(); },220);}catch(e){} }

/* restore bike checkbox & exercise states */
(function restore(){
  const bike = localStorage.getItem('bike_v2'); if(bike && bike===nowYMD()) $('#bikeDone').checked=true;
  state = JSON.parse(localStorage.getItem(storageKey)||'{}');
  treinos[treino].forEach((_,i)=>{ const k=`${day}_${i}`; if(state[k]){ const btn = $('#btn-'+i); const fill = $('#fill-'+i); if(btn){ btn.classList.add('done'); btn.innerText='✔ Feito'; } if(fill) fill.style.width='100%'; }});
})();

/* back */
$('#backBtn').addEventListener('click', ()=> location.href='index.html');

</script>
</body>
</html>
