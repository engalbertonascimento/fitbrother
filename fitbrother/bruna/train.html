<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Treino do Dia</title>
<style>
:root{
  --primary:#ffce45; --primary-600:#e0b000;
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#6b7280; --success:#34d399;
  --glass: rgba(255,255,255,0.6);
  --shadow: 0 6px 20px rgba(0,0,0,0.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.header{
  background:var(--primary);
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.back{font-size:20px;cursor:pointer;border:none;background:transparent}
.title{font-weight:800;font-size:16px}
.container{padding:16px;padding-bottom:120px}
.banner{height:0px} /* reserved if needed */

.card{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
  border:1px solid rgba(0,0,0,0.03);
}

.box { /* legacy alias for card-like elements */
  background:var(--card);
  padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow);
}

.small{font-size:13px;color:var(--muted)}
.exercise-card{display:flex;flex-direction:column;gap:10px}
.exercise-card h3{margin:0;font-size:16px}
.exercise-card .desc{margin:0;color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;align-items:center;margin-top:8px}
.done-btn{background:var(--primary);border:none;padding:10px;border-radius:10px;font-weight:800;cursor:pointer;transition:all .18s}
.done-btn:active{transform:translateY(1px)}
.done-btn.done{background:var(--success);color:#fff}
.progress-bar{height:10px;background:#eee;border-radius:10px;overflow:hidden;width:140px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-600));width:0%;transition:width .3s}
.timer{font-weight:700}
.info-row{display:flex;gap:12px;align-items:center}

.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:76px;background:#fff;border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-around;padding:8px 20px;box-shadow:0 -6px 20px rgba(0,0,0,0.06)}
.nav-button{display:flex;flex-direction:column;align-items:center;border:none;background:transparent;cursor:pointer;gap:6px}
.nav-button span{font-size:12px;color:var(--muted)}
.action-row{display:flex;gap:8px;align-items:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111;color:#fff;padding:10px 14px;border-radius:10px;display:none;z-index:1400;box-shadow:0 6px 20px rgba(0,0,0,0.4)}

/* responsive */
@media(min-width:720px){
  .container{max-width:900px;margin:0 auto}
  .exercise-card{flex-direction:row;align-items:center;justify-content:space-between}
  .exercise-card .meta {min-width:320px}
}
</style>
</head>
<body>

<header class="header">
  <button class="back" id="backBtn" aria-label="Voltar">←</button>
  <div class="title" id="headerTitle">Treino</div>
  <div style="margin-left:auto" class="small" id="dayLabel">Segunda</div>
</header>

<main class="container" id="main">
  <!-- Bike card -->
  <div class="card" id="bikeCard" aria-live="polite">
    <div style="display:flex;gap:12px;align-items:center">
      <div style="font-size:22px">🚴</div>
      <div style="flex:1">
        <div style="font-weight:700">30 minutos de corda (quando possível)</div>
        <div class="small">Apoio dos treinos de cardio para serem realizados quando possível em apoio dos treinos.</div>
      </div>
      <div style="margin-left:auto;text-align:right">
        <label class="small" style="display:block"><input type="checkbox" id="bikeDone"> Concluído</label>
        <div style="height:6px"></div>
        <div class="timer small" id="bikeTimer"></div>
      </div>
    </div>

    <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
      <button id="startBike" class="done-btn">Iniciar 20m</button>
      <button id="stopBike" class="done-btn" style="background:#ddd;color:#000">Parar</button>
      <div class="small" style="margin-left:auto">Sugestão: usar intensidade leve</div>
    </div>
  </div>

  <!-- Exercises list -->
  <div id="exerciseList"></div>

  <div style="display:flex;gap:12px;justify-content:center;margin-top:6px">
    <button id="finishAll" class="done-btn">Concluir Treino</button>
  </div>
</main>

<nav class="bottom-nav" aria-label="Navegação inferior">
  <button class="nav-button" id="navHome" title="Home">🏠<span>Home</span></button>
  <button class="nav-button" id="navTrain" title="Treinos">🏋️<span>Treinos</span></button>
  <button class="nav-button" id="navProgress" title="Progresso">📈<span>Progresso</span></button>
  <button class="nav-button" id="navProfile" title="Perfil">👤<span>Perfil</span></button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* -------------------------
   Helpers & storage keys
   ------------------------- */
function $(sel){return document.querySelector(sel)}
function $all(sel){return Array.from(document.querySelectorAll(sel))}
const KEY_EX_DONE = 'exercise_done_v3';
const KEY_DONE = 'treinosConcluidos_v2';
const KEY_HISTORY = 'history_v2';
const KEY_POINTS = 'points_v2';
const KEY_BIKE = 'bike_v2';
const KEY_GAMER = 'gamer_v1';

function nowYMD(d=new Date()){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function showToast(msg, t=1400){
  const el = $('#toast'); el.innerText = msg; el.style.display='block'; el.style.opacity=1;
  setTimeout(()=>{ el.style.opacity=0; setTimeout(()=> el.style.display='none',300); }, t);
}

/* -------------------------
   Data: exercises with desc
   ------------------------- */
const mapDayToTreino = {segunda:'A',terca:'C',quarta:'A',quinta:'B',sexta:'A'};
const treinos = {
  A:[
    {nome:'Polichinelos', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Corrida Estacionária', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Afundo Búlgaro', desc:'4 séries × 10 repetições'},
    {nome:'Glúteo Coice', desc:'4 séries × 10 repetições'},
    {nome:'Cadeira Extensora', desc:'4 séries × 10 repetições'},
    {nome:'Mesa flexora', desc:'4 séries × 10 repetições'},
    {nome:'Stiff com Halteres ou Barra', desc:'4 séries × 10 repetições'},
    {nome:'Abdominal Canivete', desc:'4 séries x 12 repetições'},
    {nome:'Prancha', desc:'4 séries x 45 minutos'}
  ],
  B:[
    {nome:'Polichinelos', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Corrida Estacionária', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Barra fixa no Gráviton (máquina)', desc:'4 séries × 10 repetições'},
    {nome:'Remada Curvada com Halteres', desc:'4 séries × 10 repetições'},
    {nome:'Rosca Martelo', desc:'4 séries × 10 repetições'},
    {nome:'Rosca Concentrada ou Rosca Direta com Barra', desc:'4 séries × 10 repetições'},
    {nome:'Abdominal Canivete', desc:'4 séries x 12 repetições'},
    {nome:'Prancha', desc:'4 séries x 45 minutos'}
  ],
  C:[
    {nome:'Polichinelos', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Corrida Estacionária', desc:'4 séries × 45 segundos de exercício'},
    {nome:'Barra fixa no Gráviton (máquina)', desc:'4 séries × 10 repetições'},
    {nome:'Remada Curvada com Halteres', desc:'4 séries × 10 repetições'},
    {nome:'Rosca Martelo', desc:'4 séries × 10 repetições'},
    {nome:'Rosca Concentrada ou Rosca Direta com Barra', desc:'4 séries × 10 repetições'},
    {nome:'Abdominal Canivete', desc:'4 séries x 12 repetições'},
    {nome:'Prancha', desc:'4 séries x 45 minutos'}
  ]
};

/* -------------------------
   Determine day & treino
   ------------------------- */
const params = new URLSearchParams(location.search);
let day = params.get('day') || 'segunda';
if(day === 'hoje'){
  const w = new Date().getDay(); // 0 Sun - 6 Sat
  const mapIdx = {1:'segunda',2:'terca',3:'quarta',4:'quinta',5:'sexta'};
  day = mapIdx[w] || 'segunda';
}
const treinoKey = mapDayToTreino[day] || 'A';
$('#headerTitle').innerText = `Treino ${treinoKey}`;
$('#dayLabel').innerText = day.charAt(0).toUpperCase() + day.slice(1);

/* -------------------------
   State
   ------------------------- */
let state = JSON.parse(localStorage.getItem(KEY_EX_DONE) || '{}');

/* -------------------------
   Render exercises
   ------------------------- */
const elList = $('#exerciseList');

function render(){
  elList.innerHTML = '';
  const arr = treinos[treinoKey];
  arr.forEach((ex, i) => {
    const key = `${day}_${i}`;
    const done = !!state[key];
    const card = document.createElement('div');
    card.className = 'card exercise-card';
    card.innerHTML = `
      <div style="flex:1">
        <h3>${i+1}. ${ex.nome}</h3>
        <p class="desc">${ex.desc}</p>
      </div>
      <div class="meta" style="display:flex;align-items:center;gap:12px;margin-left:12px">
        <div class="progress-bar" aria-hidden><div class="progress-fill" id="fill-${i}" style="width:${done?100:0}%"></div></div>
        <select id="sel-${i}" aria-label="Duração/tempo">
          <option value="30">30s</option><option value="45">45s</option><option value="60">60s</option>
        </select>
        <button class="done-btn ${done?'done':''}" id="btn-${i}" aria-pressed="${done?true:false}" style="margin-left:8px">${done?'✔ Feito':'Marcar como feito'}</button>
      </div>
    `;
    elList.appendChild(card);

    // handlers
    card.querySelector('#btn-'+i).addEventListener('click', ()=> toggleDone(i));
    card.querySelector('#sel-'+i).addEventListener('change', ()=> {/* reserved */});
  });
}
render();

/* -------------------------
   Toggle done for an exercise
   ------------------------- */
function toggleDone(i){
  const key = `${day}_${i}`;
  state[key] = !state[key];
  if(!state[key]) delete state[key];
  localStorage.setItem(KEY_EX_DONE, JSON.stringify(state));
  const btn = $('#btn-'+i), fill = $('#fill-'+i);
  if(state[key]){
    btn.classList.add('done'); btn.innerText='✔ Feito'; btn.setAttribute('aria-pressed','true');
    if(fill) fill.style.width='100%';
    playSuccess();
  }else{
    btn.classList.remove('done'); btn.innerText='Marcar como feito'; btn.setAttribute('aria-pressed','false');
    if(fill) fill.style.width='0%';
  }
}

/* -------------------------
   Finish all - mark day done
   ------------------------- */
$('#finishAll').addEventListener('click', ()=>{
  const doneObj = JSON.parse(localStorage.getItem(KEY_DONE) || '{}');
  doneObj[day] = true;
  localStorage.setItem(KEY_DONE, JSON.stringify(doneObj));

  // add to history
  const history = JSON.parse(localStorage.getItem(KEY_HISTORY) || '[]');
  history.unshift({day:day, date:nowYMD()});
  localStorage.setItem(KEY_HISTORY, JSON.stringify(history.slice(0,200)));

  // points
  const pts = Number(localStorage.getItem(KEY_POINTS) || 0) + 15;
  localStorage.setItem(KEY_POINTS, String(pts));

  // notify parent (home)
  try{ window.opener && window.opener.postMessage({type:'treinoConcluido', day}, '*'); }catch(e){}
  try{ window.parent && window.parent.postMessage({type:'treinoConcluido', day}, '*'); }catch(e){}

  showToast('Treino concluído! Bom trabalho!');
  setTimeout(()=> location.href='index.html', 900);
});

/* -------------------------
   Bike timer controls
   ------------------------- */
let bikeIv = null;
let bikeRemaining = 0;

$('#startBike').addEventListener('click', ()=>{
  startCountdown(30*60, '#bikeTimer', ()=>{
    $('#bikeDone').checked = true;
    localStorage.setItem(KEY_BIKE, nowYMD());
    showToast('30 minutos concluídos ✔');
  });
});

$('#stopBike').addEventListener('click', ()=>{
  clearInterval(bikeIv);
  bikeIv = null;
  $('#bikeTimer').innerText = '';
});

function startCountdown(sec, sel, cb){
  clearInterval(bikeIv);
  bikeRemaining = sec;
  const el = document.querySelector(sel);
  el.innerText = formatTime(bikeRemaining);
  bikeIv = setInterval(()=>{
    bikeRemaining--;
    if(bikeRemaining < 0){
      clearInterval(bikeIv); bikeIv = null;
      el.innerText = '✔ Pronto';
      cb && cb();
      return;
    }
    el.innerText = formatTime(bikeRemaining);
  }, 1000);
}
function formatTime(s){ return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }

/* -------------------------
   Success sound (subtle)
   ------------------------- */
function playSuccess(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    o.start(0);
    g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.16);
    setTimeout(()=>{ o.stop(); ctx.close(); }, 220);
  }catch(e){}
}

/* -------------------------
   Restore state on load
   ------------------------- */
(function restore(){
  // bike checkbox
  const bike = localStorage.getItem(KEY_BIKE);
  if(bike && bike === nowYMD()) $('#bikeDone').checked = true;

  // exercise states
  state = JSON.parse(localStorage.getItem(KEY_EX_DONE) || '{}');
  treinos[treinoKey].forEach((_, i)=>{
    const k = `${day}_${i}`;
    if(state[k]){
      const btn = $('#btn-'+i);
      const fill = $('#fill-'+i);
      if(btn){ btn.classList.add('done'); btn.innerText='✔ Feito'; btn.setAttribute('aria-pressed','true'); }
      if(fill) fill.style.width='100%';
    }
  });
})();

/* -------------------------
   Header / nav bindings
   ------------------------- */
$('#backBtn').addEventListener('click', ()=> location.href='index.html');
$('#navHome').addEventListener('click', ()=> location.href='index.html');
$('#navTrain').addEventListener('click', ()=> location.href='treino.html?day=hoje');
$('#navProgress').addEventListener('click', ()=> location.href='progresso.html');
$('#navProfile').addEventListener('click', ()=> location.href='perfil.html');

/* keyboard accessibility (quick mark finished) */
window.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'm'){
    // mark all exercises done (quick dev helper)
    treinos[treinoKey].forEach((_,i)=>{ const k = `${day}_${i}`; state[k]=true; });
    localStorage.setItem(KEY_EX_DONE, JSON.stringify(state));
    render();
    showToast('Todos marcados ✔');
  }
});
</script>

</body>
</html>
